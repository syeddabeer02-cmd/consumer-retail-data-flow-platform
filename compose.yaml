x-airflow: &airflow
  build:
    context: .
    dockerfile: infrastructure/Dockerfile.airflow
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${AIRFLOW_DB_PASSWORD:?Set AIRFLOW_DB_PASSWORD in .env}@postgres/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
    AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY:?Set AIRFLOW_SECRET_KEY in .env}
    SPARK_LOCAL_IP: 127.0.0.1
  security_opt: [no-new-privileges:true]
  volumes:
    - ./dags:/opt/airflow/dags:ro
    - retail-data:/opt/airflow/data
    - airflow-logs:/opt/airflow/logs
  depends_on:
    postgres:
      condition: service_healthy
services:
  dashboard:
    build:
      context: .
      dockerfile: infrastructure/Dockerfile.dashboard
    security_opt: [no-new-privileges:true]
    volumes:
      - retail-data:/opt/airflow/data:ro
    ports: ['127.0.0.1:8501:8501']
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8501/health', timeout=5)"]
      interval: 15s
      retries: 5
  pipeline:
    security_opt: [no-new-privileges:true]
    profiles: [demo]
    build:
      context: .
      dockerfile: infrastructure/Dockerfile
    volumes:
      - retail-data:/app/data
    command: [demo, --date, '2026-10-01', --rows, '1000']
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD:?Set AIRFLOW_DB_PASSWORD in .env}
      POSTGRES_DB: airflow
    volumes:
      - airflow-db:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U airflow']
      interval: 5s
      retries: 10
  airflow-init:
    <<: *airflow
    environment:
      <<: *airflow-env
      ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:?Set AIRFLOW_ADMIN_PASSWORD in .env}
    entrypoint: /bin/bash
    command:
      - -c
      - >-
        airflow db migrate &&
        (airflow users list --output json | python -c 'import json,sys;sys.exit(0 if any(u["username"]=="admin" for u in json.load(sys.stdin)) else 1)' ||
        airflow users create --username admin --firstname Retail --lastname Admin --role Admin --email admin@example.invalid --password "$$ADMIN_PASSWORD")
  airflow-webserver:
    <<: *airflow
    command: webserver
    ports: ['127.0.0.1:8081:8080']
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8080/health', timeout=5)"]
      interval: 20s
      start_period: 60s
      retries: 10
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
  airflow-scheduler:
    <<: *airflow
    command: scheduler
    healthcheck:
      test: [CMD-SHELL, 'airflow jobs check --job-type SchedulerJob --hostname "$${HOSTNAME}"']
      interval: 20s
      start_period: 60s
      retries: 10
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
volumes:
  retail-data:
  airflow-logs:
  airflow-db:
